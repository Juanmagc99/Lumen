services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${LUMEN_POSTGRES_DB:-lumen}
      POSTGRES_USER: ${LUMEN_POSTGRES_USER:-lumen}
      POSTGRES_PASSWORD: ${LUMEN_POSTGRES_PASSWORD:?Set LUMEN_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${LUMEN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
